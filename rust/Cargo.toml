[package]
name = "rust_lib_nexa_messaging_desktop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
dirs = "7.0.0"
flutter_rust_bridge = "=2.13.0"
futures-util = "0.3.34"
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]

